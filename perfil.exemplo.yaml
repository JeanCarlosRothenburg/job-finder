# Perfil de EXEMPLO. Copie para perfil.yaml e preencha a partir do seu currículo.
# As skills abaixo são só ilustrativas: nunca liste algo que não está no currículo.
# "profissional" = usada no trabalho; "conhecimento" = estudada, sem uso profissional.
exemplo: true
nome: Jean

skills:
  profissional:
    - nome: Java
      anos: 3
    - nome: SQL
      sinonimos: [postgresql, banco de dados relacional]
    - nome: JavaScript
    - nome: Git
    - nome: APIs REST
  conhecimento:
    - nome: Python
    - nome: React
    - nome: Docker
    - nome: Testes automatizados
    - nome: CI/CD
    - nome: Scrum

# Sinônimos próprios (além dos padrões em src/job_finder/perfil.py)
sinonimos:
  sql: [mysql, oracle, sql server]

formacao:
  - Engenharia de Software (UDESC), em curso
  - Técnico em Informática (IFC)

idiomas:
  ingles: tecnico   # tecnico | intermediario | avancado | fluente

localidade:
  cidade_base: Presidente Getúlio
  uf_base: SC
  raio_km: 70                 # presencial e híbrido só dentro deste raio
  cidades_aceitas_extra: []   # ex.: [Jaraguá do Sul/SC] para aceitar fora do raio

filtros:
  senioridades_aceitas: [junior, pleno]
  max_anos_exigidos: 4        # vagas que pedem 5+ anos são descartadas
  contratos_aceitos: [clt, pj]
  titulos_incluir:   # variações com hífen, espaço ou junto são equivalentes (back-end = back end = backend)
    - desenvolvedor
    - desenvolvedora
    - pessoa desenvolvedora
    - desenvolvimento
    - developer
    - dev
    - programador
