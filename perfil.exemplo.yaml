    - software engineer
    - analista desenvolvedor
    - analista programador
    - analista de sistemas
    - back-end
    - backend
    - front-end
    - frontend
    - full-stack
    - fullstack
    - web
  titulos_excluir:
    - estagio
    - estagiario
    - estagiaria
    - trainee
    - jovem aprendiz
    - senior
    - sr
    - especialista
    - lider
    - tech lead
    - head
