[project]
name = "job-finder"
version = "0.1.0"
description = "Busca, filtra e pontua vagas de Engenharia de Software e prepara candidaturas semiautomáticas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-finder = "job_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
